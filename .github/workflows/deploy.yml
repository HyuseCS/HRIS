name: Deploy

# Runs after CI succeeds on main. Builds the image on the runner (the 512MB droplet
# can't), pushes it to GHCR, then SSHes into the droplet to pull and restart. Also
# triggerable by hand.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aguynamedkent7/veent-hris

jobs:
  build:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    # Only build when CI passed (workflow_dispatch has no workflow_run payload, so the
    # conclusion is empty and the second clause allows a manual run).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 for the droplet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & restart on droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            # Authenticate to GHCR so the (private) image can be pulled. Skip this if you
            # make the GHCR package public — then no login is needed.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/repos/Veent_HRIS
            # Refresh compose file / config (.env.prod is gitignored, so it's untouched).
            git fetch --all --prune
            git reset --hard origin/main
            # Pull the freshly built image and restart. --no-build guarantees the droplet
            # never tries to compile (it can't). Compose runs `prisma db push` on app start.
            docker compose pull
            docker compose up -d --no-build
            docker image prune -f

            # `up -d` returns as soon as the container STARTS, so a failure inside
            # prestart.sh (the migration or `prisma db push`) means `node build` never runs
            # and the app crash-loops while this workflow reports a successful deploy —
            # exactly the #236 failure mode. Wait for the app to actually answer.
            command -v curl >/dev/null || { echo "curl is not installed on the droplet, so the post-deploy check cannot run. Install it (apt-get install -y curl)."; exit 1; }
            echo "Waiting for the app to serve on :3000 ..."
            for i in $(seq 1 30); do
              # `|| code=000` on the assignment, NOT `|| echo 000` inside the substitution:
              # curl prints 000 itself on a connection failure, so appending a second 000
              # would make $code "000\n000" — which is != "000", i.e. a dead app read as up.
              code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:3000/) || code=000
              if [ "$code" != "000" ]; then
                echo "App answered HTTP $code after $((i * 2))s."
                exit 0
              fi
              sleep 2
            done
            echo "App never answered on :3000 after 60s — deploy failed. Last 80 log lines:"
            docker compose logs --tail=80 app || true
            exit 1
